<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>잡스크래퍼</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
        <style>
            :root {
                --brand: #0b5cff;
                --brand-dark: #0047d6;
                --text: #222;
                --sub: #777;
                --line: #e4e6eb;
                --bg: #f4f6f9;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: "Pretendard", "Malgun Gothic", sans-serif;
                color: var(--text);
                background: var(--bg);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            a { color: inherit; text-decoration: none; }

            /* 상단 유틸바 */
            .util {
                background: #fff;
                border-bottom: 1px solid var(--line);
                font-size: 12px;
                color: var(--sub);
            }
            .util .inner {
                max-width: 1100px;
                margin: 0 auto;
                padding: 8px 16px;
                display: flex;
                justify-content: flex-end;
                gap: 14px;
            }

            /* 메인 검색 영역 */
            .hero {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 80px 16px;
                background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
            }
            .logo {
                font-size: 44px;
                font-weight: 800;
                letter-spacing: -1.5px;
                color: var(--brand);
                margin-bottom: 8px;
            }
            .logo span { color: var(--text); }
            .tagline {
                color: var(--sub);
                font-size: 15px;
                margin-bottom: 32px;
            }
            .search-box {
                display: flex;
                width: 100%;
                max-width: 640px;
                border: 3px solid var(--brand);
                border-radius: 40px;
                background: #fff;
                overflow: hidden;
                box-shadow: 0 6px 20px rgba(11, 92, 255, 0.12);
            }
            .search-box input {
                flex: 1;
                min-width: 0;
                border: none;
                outline: none;
                padding: 16px 24px;
                font-size: 17px;
                font-family: inherit;
            }
            .search-box button {
                border: none;
                background: var(--brand);
                color: #fff;
                font-size: 16px;
                font-weight: 700;
                font-family: inherit;
                padding: 0 32px;
                cursor: pointer;
            }
            .search-box button:hover { background: var(--brand-dark); }

            /* 인기 검색어 */
            .popular {
                margin-top: 24px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                font-size: 13px;
            }
            .popular strong { color: var(--sub); font-weight: 600; margin-right: 4px; }
            .popular a {
                padding: 6px 14px;
                border: 1px solid var(--line);
                border-radius: 20px;
                background: #fff;
                color: #444;
            }
            .popular a:hover { border-color: var(--brand); color: var(--brand); }

            footer {
                border-top: 1px solid var(--line);
                background: #fff;
                font-size: 12px;
                color: var(--sub);
                text-align: center;
                padding: 20px 16px;
            }
        </style>
    </head>
    <body>
        <div class="util">
            <div class="inner">
                <a href="#">로그인</a>
                <a href="#">회원가입</a>
                <a href="#">고객지원</a>
            </div>
        </div>

        <main class="hero">
            <h1 class="logo">job<span>scrapper</span></h1>
            <p class="tagline">인크루트 채용공고를 키워드 하나로 모아보세요</p>

            <form action="/search" class="search-box">
                <input type="text" name="keyword" placeholder="직무, 기술스택, 회사명을 입력하세요" required autofocus />
                <button>검색하기</button>
            </form>

            <div class="popular">
                <strong>인기 검색어</strong>
                <a href="/search?keyword=파이썬">#파이썬</a>
                <a href="/search?keyword=자바">#자바</a>
                <a href="/search?keyword=프론트엔드">#프론트엔드</a>
                <a href="/search?keyword=데이터분석">#데이터분석</a>
                <a href="/search?keyword=AI">#AI</a>
            </div>
        </main>

        <footer>
            Copyright © jobscrapper. 채용정보 출처: 인크루트
        </footer>
    </body>
</html>
